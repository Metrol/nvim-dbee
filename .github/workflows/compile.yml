name: Build fork release

on:
  push:
    tags: ["v*-metrol.*"]

permissions:
  contents: write

concurrency:
  group: dbee-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: dbee/go.sum
      - name: Verify release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path("lua/dbee/install/__manifest.lua").read_text()
          assert 'version = "' + os.environ["RELEASE_TAG"] + '"' in manifest, "Update the manifest before tagging a release"
          PY
      - name: Test backend
        working-directory: dbee
        env:
          CGO_ENABLED: "1"
        run: |
          go test -mod=readonly ./core/... ./handler/...
          go test -mod=readonly ./adapters -run 'TestPostgresBound|Test_parseDatabaseFromPath' -count=1
      - name: Build Linux x86-64 backend with DuckDB
        working-directory: dbee
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -mod=readonly -trimpath -o ../dist/dbee .
          ../dist/dbee -manifest /tmp/dbee-register.lua > /tmp/dbee-manifest-rpc.log
          diff -u ../lua/dbee/api/__register.lua /tmp/dbee-register.lua
      - name: Package and checksum
        working-directory: dist
        run: |
          tar -czf dbee_linux_amd64.tar.gz dbee
          sha256sum dbee_linux_amd64.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/dbee_linux_amd64.tar.gz dist/SHA256SUMS \
            --verify-tag --title "DBee $RELEASE_TAG" \
            --notes "Prebuilt Linux x86-64 backend, including DuckDB. Install with require(\"dbee\").install(); Go and build tools are not required."
